<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 24px;
        width: 100%;
        max-width: 360px;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        color: #a0a0a0;
        margin-bottom: 16px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        gap: 8px;
      }

      input {
        flex: 1;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        color: #f0f0f0;
        font-size: 15px;
        padding: 10px 14px;
        outline: none;
        transition: border-color 0.15s;
      }

      input:focus { border-color: #555; }
      input::placeholder { color: #555; }

      button {
        background: #2563eb;
        border: none;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 18px;
        transition: background 0.15s;
        white-space: nowrap;
      }

      button:hover:not(:disabled) { background: #1d4ed8; }
      button:disabled { background: #1e3a6e; color: #6b8fd4; cursor: not-allowed; }

      #price {
        font-size: 28px;
        font-weight: 700;
        color: #4ade80;
        margin-top: 20px;
        min-height: 36px;
      }

      #error {
        font-size: 13px;
        color: #f87171;
        margin-top: 8px;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Stock Price</h1>
      <div class="row">
        <input id="symbol" type="text" placeholder="AAPL" autocomplete="off" />
        <button id="fetch-btn">Get Price</button>
      </div>
      <p id="price"></p>
      <p id="error"></p>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
